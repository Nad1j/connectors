<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- faint ring linking the five platforms -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#neon)" stroke-opacity="0.22" stroke-width="3"/>

  <!-- spokes from the hub to the five platforms -->
  <g stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="256" x2="256" y2="106"/>
    <line x1="256" y1="256" x2="398.66" y2="209.65"/>
    <line x1="256" y1="256" x2="344.17" y2="377.35"/>
    <line x1="256" y1="256" x2="167.83" y2="377.35"/>
    <line x1="256" y1="256" x2="113.34" y2="209.65"/>
  </g>

  <!-- platform nodes -->
  <g filter="url(#glow)">
    <circle cx="256" cy="106" r="26" fill="url(#neon)"/>
    <circle cx="398.66" cy="209.65" r="26" fill="url(#neon)"/>
    <circle cx="344.17" cy="377.35" r="26" fill="url(#neon)"/>
    <circle cx="167.83" cy="377.35" r="26" fill="url(#neon)"/>
    <circle cx="113.34" cy="209.65" r="26" fill="url(#neon)"/>
  </g>
  <g fill="#0B1020">
    <circle cx="256" cy="106" r="11"/>
    <circle cx="398.66" cy="209.65" r="11"/>
    <circle cx="344.17" cy="377.35" r="11"/>
    <circle cx="167.83" cy="377.35" r="11"/>
    <circle cx="113.34" cy="209.65" r="11"/>
  </g>

  <!-- hub with play mark -->
  <circle cx="256" cy="256" r="62" fill="url(#neon)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M240 226 L240 286 L292 256 Z" fill="#0B1020"/>
</svg>
