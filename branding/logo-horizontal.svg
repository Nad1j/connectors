<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#0B1020"/>

  <!-- mark, scaled from the 512 icon grid: translate(30,30) scale(0.6) -->
  <g transform="translate(30,30) scale(0.6)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#neon)" stroke-opacity="0.22" stroke-width="3"/>
    <g stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
      <line x1="256" y1="256" x2="256" y2="106"/>
      <line x1="256" y1="256" x2="398.66" y2="209.65"/>
      <line x1="256" y1="256" x2="344.17" y2="377.35"/>
      <line x1="256" y1="256" x2="167.83" y2="377.35"/>
      <line x1="256" y1="256" x2="113.34" y2="209.65"/>
    </g>
    <g filter="url(#glow)" fill="url(#neon)">
      <circle cx="256" cy="106" r="26"/>
      <circle cx="398.66" cy="209.65" r="26"/>
      <circle cx="344.17" cy="377.35" r="26"/>
      <circle cx="167.83" cy="377.35" r="26"/>
      <circle cx="113.34" cy="209.65" r="26"/>
    </g>
    <g fill="#0B1020">
      <circle cx="256" cy="106" r="11"/>
      <circle cx="398.66" cy="209.65" r="11"/>
      <circle cx="344.17" cy="377.35" r="11"/>
      <circle cx="167.83" cy="377.35" r="11"/>
      <circle cx="113.34" cy="209.65" r="11"/>
    </g>
    <circle cx="256" cy="256" r="62" fill="url(#neon)" filter="url(#glow)"/>
    <path d="M240 226 L240 286 L292 256 Z" fill="#0B1020"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="700" letter-spacing="2" fill="#F1F5F9">Connect<tspan fill="url(#word)">ors</tspan></text>
  <text x="404" y="270" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="9" fill="#94A3B8">ONE VIDEO · EVERY PLATFORM</text>
</svg>
